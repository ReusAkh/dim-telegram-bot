name: Test DİM Monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository-ni yüklə
        uses: actions/checkout@v4

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lazım olan kitabxanaları quraşdır
        run: pip install -r requirements.txt

      - name: DİM monitorunu işə sal
        run: python dim_monitor.py
