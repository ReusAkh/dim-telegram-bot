name: Test DİM Monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository-ni götür
        uses: actions/checkout@v4

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests quraşdır
        run: pip install requests

      - name: DİM səhifəsini yoxla
        run: python dim_monitor.py
